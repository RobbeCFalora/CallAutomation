name: Fathom -> Notion sync

on:
  schedule:
    # Een keer per dag, om 05:00 UTC (~7u 's ochtends in Belgie in de zomer,
    # 6u in de winter). Pas het uur gerust aan naar wanneer het jou best past.
    # LOOKBACK_HOURS in de repo-secrets moet groter blijven dan dit interval
    # (24u) zodat een gemiste of trage run nooit een call overslaat - de
    # default van 26u in config.py voldoet daaraan, maar met maar 2u marge;
    # overweeg die desgewenst iets ruimer te zetten (bv. 30).
    - cron: "0 5 * * *"
  workflow_dispatch: {}
    # Hiermee kan je de sync ook handmatig starten vanuit het "Actions"-tabblad
    # op GitHub, bv. om te testen zonder op de cron te wachten.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          FATHOM_API_KEY: ${{ secrets.FATHOM_API_KEY }}
          FATHOM_RECORDED_BY_EMAIL: ${{ secrets.FATHOM_RECORDED_BY_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          LOOKBACK_HOURS: ${{ secrets.LOOKBACK_HOURS }}
        run: python sync.py
